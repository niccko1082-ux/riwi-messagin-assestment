services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_SUPERUSER}
      POSTGRES_PASSWORD: ${DB_SUPERUSER_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Servicio de un solo uso: aplica las 10 migraciones reales (misma invocación psql que
  # producción, con :'app_password'/:'worker_password' como variables de psql) y termina.
  migrate:
    image: pgvector/pgvector:pg16
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      PGPASSWORD: ${DB_SUPERUSER_PASSWORD}
    volumes:
      - ./database/migrations:/migrations:ro
    command:
      - /bin/sh
      - -c
      - >-
        set -e && for f in /migrations/*.sql; do
        echo "Aplicando $$f" &&
        psql -h db -U "$$DB_SUPERUSER" -d "$$DB_NAME" -v ON_ERROR_STOP=1
        -v app_password="$$DB_APP_PASSWORD" -v worker_password="$$DB_WORKER_PASSWORD"
        -f "$$f";
        done

  backend:
    build: ./backend
    depends_on:
      migrate:
        condition: service_completed_successfully
    # .env ya trae DB_HOST=db/SERVER_PORT=8080 pensados para esta red de Compose — una sola
    # fuente de verdad, sin duplicar cada variable aquí (CORS_ALLOWED_ORIGINS incluida: si se
    # remapea el puerto del frontend más abajo, basta con editar .env).
    env_file: .env
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8080
        VITE_WS_URL: ws://localhost:8080/ws
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  db_data:
