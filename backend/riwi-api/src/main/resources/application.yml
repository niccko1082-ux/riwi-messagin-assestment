server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: riwi-messaging-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bd_nombre_apellido_clan}
    username: ${DB_APP_USER:rw_app}
    password: ${DB_APP_PASSWORD:}
  jackson:
    default-property-inclusion: non_null

riwi:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:}
    access-token-ttl: ${JWT_ACCESS_TTL:PT15M}
    refresh-token-ttl: ${JWT_REFRESH_TTL:P7D}
  worker-datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bd_nombre_apellido_clan}
    username: ${DB_WORKER_USER:rw_worker}
    password: ${DB_WORKER_PASSWORD:}
  seed:
    enabled: ${SEED_ENABLED:false}
    file: ${SEED_FILE:database/seed/seed.json}
    # rw_app (spring.datasource) solo tiene SELECT: sembrar usuarios/canales/mensajes
    # requiere el superusuario, igual que 'migrate' en docker-compose.yml.
    superuser-url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bd_nombre_apellido_clan}
    superuser-username: ${DB_SUPERUSER:postgres}
    superuser-password: ${DB_SUPERUSER_PASSWORD:}
  ai:
    nvidia:
      base-url: ${NVIDIA_BASE_URL:https://integrate.api.nvidia.com/v1}
      api-key: ${NVIDIA_API_KEY:}
      chat-model: ${NVIDIA_CHAT_MODEL:openai/gpt-oss-20b}
      embedding-model: ${NVIDIA_EMBEDDING_MODEL:nvidia/llama-nemotron-embed-vl-1b-v2}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{correlationId}] %-5level %logger{36} - %msg%n"
